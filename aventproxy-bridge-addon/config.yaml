name: "Philips Avent WebRTC Bridge"
description: "Streams Philips Avent baby monitors over RTSP, from the local network where possible and the cloud otherwise."
version: "2.1.1"
slug: "aventproxy_bridge"
url: "https://github.com/leonardpitzu/aventproxy"
arch:
  - amd64
  - aarch64
homeassistant: "2025.2.0"
stage: stable
host_network: true
apparmor: true
options:
  cameras: []
schema:
  signing_key: str?
  sid: str?
  ecode: str?
  partner: str?
  app_key: str?
  device_id: str?
  package_name: str?
  api_host: str?
  talkback: bool?
  uid: str?
  cameras:
    - camera_id: str?
      camera_name: str?
      product_id: str?
      local_key: str?
      password: str?
      lan_ip: str?
startup: "application"
boot: "auto"
environment:
  WAIT_FOR_CONFIG: "true"
map:
  - config:rw
