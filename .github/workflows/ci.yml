name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Check for errors
        run: ruff check custom_components/ examples/ tools/ --ignore E501

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: pip install pytest pycryptodome aiohttp voluptuous
      - name: Run tests
        run: PYTHONPATH=. pytest tests/test_philips_avent/ -v --tb=short

  bridge:
    name: Bridge (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: avent-webrtc-bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Build
        run: go build -o avent-webrtc-bridge .
      - name: Test
        run: go test ./...
      - name: Verify binary
        run: ./avent-webrtc-bridge --help

  addon:
    name: Add-on image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [tests, bridge]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The Supervisor builds with the add-on folder as context, so the bridge
      # source has to sit inside it.
      - name: Stage bridge source
        run: cp -r avent-webrtc-bridge aventproxy-bridge-addon/avent-webrtc-bridge

      - name: Read add-on version
        id: addon
        run: awk -F'"' '/^version:/{print "version=" $2}' aventproxy-bridge-addon/config.yaml >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Supervisor pulls <image>:<version from config.yaml>, so that tag is
      # the one that matters; bumping the version is what surfaces an update.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: aventproxy-bridge-addon
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_FROM=debian:bookworm-slim
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/leonardpitzu/aventproxy-bridge:${{ steps.addon.outputs.version }}
            ghcr.io/leonardpitzu/aventproxy-bridge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune untagged images
        if: github.event_name == 'push'
        uses: actions/delete-package-versions@v5
        with:
          package-name: aventproxy-bridge
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: "true"

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
