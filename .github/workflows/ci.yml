name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # Pinned in pyproject: an unpinned ruff turns CI red on untouched code the
      # day a new release adds a rule.
      - run: pip install --group lint
      - name: Check for errors
        run: ruff check custom_components/ tools/ tests/
      - name: Check formatting
        run: ruff format --check custom_components/ tools/ tests/

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: pip install --group test
      - name: Run tests
        run: pytest

  bridge:
    name: Bridge (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aventproxy-bridge-addon/avent-webrtc-bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: aventproxy-bridge-addon/avent-webrtc-bridge/go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o avent-webrtc-bridge .
      # The RTP forwarder fans one packet out to every viewer while sessions
      # come and go, so the race detector is the point of this job.
      - name: Test
        run: go test -race ./...
      - name: Verify binary
        run: ./avent-webrtc-bridge --help

  app:
    name: App image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [tests, bridge]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Nothing is published: the Supervisor builds this on the Home Assistant
      # host from config.yaml's version. This job only proves it still builds,
      # with the same context the Supervisor uses.
      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: aventproxy-bridge-addon
          push: false
          load: true
          tags: aventproxy-bridge:ci
          build-args: |
            BUILD_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the built binary reports its version
        run: docker run --rm aventproxy-bridge:ci avent-webrtc-bridge --version

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
