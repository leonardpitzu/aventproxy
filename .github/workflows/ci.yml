name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Check for errors
        run: ruff check custom_components/ examples/ tools/ --ignore E501

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: pip install pytest pycryptodome aiohttp voluptuous
      - name: Run tests
        run: PYTHONPATH=. pytest tests/test_philips_avent/ -v --tb=short

  bridge:
    name: Bridge (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: avent-webrtc-bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Build
        run: go build -o avent-webrtc-bridge .
      - name: Test
        run: go test ./...
      - name: Verify binary
        run: ./avent-webrtc-bridge --help

  addon:
    name: Add-on image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [tests, bridge]
    steps:
      - uses: actions/checkout@v7
      # The Supervisor builds with the add-on folder as context, so the bridge
      # source has to sit inside it.
      - name: Stage bridge source
        run: cp -r avent-webrtc-bridge aventproxy-bridge-addon/avent-webrtc-bridge
      - name: Build
        run: |
          docker build \
            --build-arg BUILD_FROM=debian:bookworm-slim \
            -t aventproxy-bridge:test \
            aventproxy-bridge-addon/
      - name: Verify binary in container
        run: docker run --rm aventproxy-bridge:test avent-webrtc-bridge --help

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
