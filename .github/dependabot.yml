version: 2
updates:
  # pion moves fast and this is a network daemon on the LAN.
  - package-ecosystem: gomod
    directory: /avent-webrtc-bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /aventproxy-bridge-addon
    schedule:
      interval: monthly
